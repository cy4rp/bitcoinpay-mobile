name: iOS Build & TestFlight

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        type: choice
        options:
          - release
          - debug
        default: release
  push:
    branches:
      - 'trigger-ios-build/**'

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS & Upload to TestFlight
    runs-on: macos-14
    timeout-minutes: 300
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack & Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.6.0 --activate
          yarn --version

      - name: Install JS dependencies
        run: yarn install --immutable

      - name: Fix module resolution for packages using exports maps
        run: |
          # @ledgerhq/domain-service uses package.json "exports" that Metro can't resolve
          # Create symlinks from package root subpaths to lib/ directory
          cd node_modules/@ledgerhq/domain-service
          ln -sf lib/signers signers
          ln -sf lib/utils utils
          echo "Created symlinks for @ledgerhq/domain-service subpath exports"
          ls -la signers/ utils/ || true

      - name: Generate InpageBridgeWeb3
        run: |
          if [ -f "scripts/build-inpage-bridge.sh" ]; then
            bash scripts/build-inpage-bridge.sh
          elif [ -f "app/core/InpageBridgeWeb3.js" ]; then
            echo "InpageBridgeWeb3.js already exists"
          else
            echo "// placeholder" > app/core/InpageBridgeWeb3.js
          fi

      - name: Create minimal .js.env
        run: |
          cat > .js.env << 'ENVEOF'
          export METAMASK_ENVIRONMENT=production
          export METAMASK_BUILD_TYPE=main
          export MM_INFURA_PROJECT_ID=placeholder
          export WALLET_CONNECT_PROJECT_ID=placeholder
          export MM_FOX_CODE=placeholder
          export SEGMENT_WRITE_KEY=placeholder
          export SEGMENT_PROXY_URL=placeholder
          export SEGMENT_DELETE_API_SOURCE_ID=placeholder
          export SEGMENT_REGULATIONS_ENDPOINT=placeholder
          export MM_SENTRY_DSN=placeholder
          export MM_SENTRY_AUTH_TOKEN=placeholder
          export SENTRY_DISABLE_AUTO_UPLOAD=true
          export MM_BRANCH_KEY_LIVE=placeholder
          export MM_BRANCH_KEY_TEST=placeholder
          export FEATURES_ANNOUNCEMENTS_ACCESS_TOKEN=placeholder
          export FEATURES_ANNOUNCEMENTS_SPACE_ID=placeholder
          export FCM_CONFIG_API_KEY=placeholder
          export FCM_CONFIG_AUTH_DOMAIN=placeholder
          export FCM_CONFIG_STORAGE_BUCKET=placeholder
          export FCM_CONFIG_PROJECT_ID=placeholder
          export FCM_CONFIG_MESSAGING_SENDER_ID=placeholder
          export FCM_CONFIG_APP_ID=placeholder
          export FCM_CONFIG_MEASUREMENT_ID=placeholder
          export PORTFOLIO_API_URL=https://portfolio.api.cx.metamask.io
          export MM_PORTFOLIO_URL=https://portfolio.api.cx.metamask.io
          export SECURITY_ALERTS_API_URL=https://security-alerts.api.cx.metamask.io
          export DECODING_API_URL=https://signature-insights.api.cx.metamask.io/v1
          export AUTH_SERVICE_URL=https://auth-service.api.cx.metamask.io
          export REWARDS_API_URL=https://rewards.api.cx.metamask.io
          export RAMPS_ENVIRONMENT=production
          export BUILDS_ENABLED_WITH_GH_ACTIONS_TEMPORARY=true
          ENVEOF

      - name: Create empty xcconfig files
        run: |
          touch ios/debug.xcconfig
          touch ios/release.xcconfig

      - name: Create placeholder GoogleService-Info.plist
        run: |
          mkdir -p ios/GoogleServices
          cat > ios/GoogleServices/GoogleService-Info.plist << 'GSEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CLIENT_ID</key>
            <string>placeholder.apps.googleusercontent.com</string>
            <key>REVERSED_CLIENT_ID</key>
            <string>com.googleusercontent.apps.placeholder</string>
            <key>API_KEY</key>
            <string>placeholder</string>
            <key>GCM_SENDER_ID</key>
            <string>000000000000</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>com.bitcoinpay.btcp</string>
            <key>PROJECT_ID</key>
            <string>bitcoinpay</string>
            <key>STORAGE_BUCKET</key>
            <string>bitcoinpay.appspot.com</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <false/>
            <key>IS_GCM_ENABLED</key>
            <true/>
            <key>IS_SIGNIN_ENABLED</key>
            <true/>
            <key>GOOGLE_APP_ID</key>
            <string>1:000000000000:ios:0000000000000000</string>
          </dict>
          </plist>
          GSEOF

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.9'
          working-directory: ios
          bundler-cache: true

      - name: Install CocoaPods
        working-directory: ios
        run: bundle exec pod install --repo-update

      - name: Configure Team ID in export options
        run: |
          sed -i '' "s/TEAM_ID_PLACEHOLDER/${{ secrets.APPLE_TEAM_ID }}/" ios/MetaMask/IosExportOptionsMetaMaskRelease.plist

      - name: Configure Node path for Xcode
        run: |
          NODE_BINARY=$(command -v node)
          echo "export NODE_BINARY=\"$NODE_BINARY\"" > ios/.xcode.env.local
          cat ios/.xcode.env.local

      - name: Setup App Store Connect API Key
        env:
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          # Write key, converting literal \n to real newlines if needed
          echo "$API_KEY_CONTENT" | sed 's/\\n/\n/g' > ios/AuthKey.p8
          LINE_COUNT=$(wc -l < ios/AuthKey.p8)
          if [ "$LINE_COUNT" -le 2 ]; then
            echo "Key has $LINE_COUNT lines, trying printf with escape interpretation..."
            printf '%b\n' "$API_KEY_CONTENT" > ios/AuthKey.p8
          fi
          LINE_COUNT=$(wc -l < ios/AuthKey.p8)
          if [ "$LINE_COUNT" -le 2 ]; then
            echo "Still $LINE_COUNT lines, reconstructing PEM from raw base64..."
            RAW=$(echo "$API_KEY_CONTENT" | tr -d '\n' | sed 's/-----BEGIN PRIVATE KEY-----//;s/-----END PRIVATE KEY-----//;s/ //g')
            printf '%s\n' '-----BEGIN PRIVATE KEY-----' > ios/AuthKey.p8
            echo "$RAW" | fold -w 64 >> ios/AuthKey.p8
            printf '%s\n' '-----END PRIVATE KEY-----' >> ios/AuthKey.p8
          fi
          chmod 600 ios/AuthKey.p8
          echo "Key file lines: $(wc -l < ios/AuthKey.p8)"
          head -1 ios/AuthKey.p8
          tail -1 ios/AuthKey.p8

          # Also place in Xcode's expected API key location
          mkdir -p ~/private_keys
          cp ios/AuthKey.p8 ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8

      - name: Install signing certificate and provisioning profile
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          # Create a fresh temporary keychain for CI signing
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="ci-$(date +%s)"

          # Create and configure keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add to search list (prepend so it's found first)
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          # Decode and import the .p12 certificate
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Verify certificate was imported
          echo "=== Imported certificates ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i "$RUNNER_TEMP/profile.mobileprovision"))
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID.mobileprovision"
          echo "Installed provisioning profile: $PROFILE_UUID"

          # Export for later steps
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Fix header search paths for native modules
        run: |
          # Fix RCTDeprecation header not found issue for non-Pod native modules
          # RCTAesForked and similar standalone Xcode projects need Pods headers path
          PODS_HEADERS="$(pwd)/ios/Pods/Headers/Public"
          echo "Adding Pods headers path: $PODS_HEADERS"

          # Find all project.pbxproj files in node_modules referenced by workspace
          find node_modules -name "project.pbxproj" -path "*/ios/*.xcodeproj/*" | while read pbxproj; do
            if grep -q "HEADER_SEARCH_PATHS" "$pbxproj"; then
              # Add Pods/Headers/Public to existing HEADER_SEARCH_PATHS entries
              sed -i '' "s|HEADER_SEARCH_PATHS = (|HEADER_SEARCH_PATHS = (\n\t\t\t\t\t\"${PODS_HEADERS}\",|g" "$pbxproj"
              echo "Patched existing HEADER_SEARCH_PATHS in: $pbxproj"
            else
              echo "No HEADER_SEARCH_PATHS found in: $pbxproj (skipping)"
            fi
          done

          # Verify the RCTAesForked fix specifically
          AESFORKED=$(find node_modules -name "project.pbxproj" -path "*react-native-aes*" | head -1)
          if [ -n "$AESFORKED" ]; then
            echo "=== RCTAesForked HEADER_SEARCH_PATHS ==="
            grep -A2 "HEADER_SEARCH_PATHS" "$AESFORKED" | head -20
          fi

      - name: Disable expo-updates resource generation to speed up build
        run: |
          # The EXUpdates pod runs Metro bundler during xcodebuild to generate
          # update resources. This takes 100+ minutes on CI runners and is not
          # needed for TestFlight builds.
          
          # Method 1: Replace shell scripts in Target Support Files
          SUPPORT_DIR="ios/Pods/Target Support Files/EXUpdates"
          if [ -d "$SUPPORT_DIR" ]; then
            find "$SUPPORT_DIR" -name "*.sh" | while read script; do
              echo "Replacing EXUpdates script: $script"
              printf '#!/bin/sh\necho "Skipped EXUpdates script for CI build"\nexit 0\n' > "$script"
              chmod +x "$script"
            done
          fi
          
          # Method 2: Patch the Pods project to replace the "Generate updates resources"
          # build phase script with a no-op. The script is embedded in project.pbxproj.
          PODS_PROJ="ios/Pods/Pods.xcodeproj/project.pbxproj"
          if [ -f "$PODS_PROJ" ]; then
            # Replace the shellScript content for "Generate updates resources for expo-updates"
            python3 -c "
          import re
          with open('ios/Pods/Pods.xcodeproj/project.pbxproj', 'r') as f:
              content = f.read()
          pattern = r'(name\s*=\s*\"\[CP-User\]\s*Generate updates resources for expo-updates\".*?shellScript\s*=\s*)\"(.*?)\"(\s*;)'
          replacement = r'\1\"echo Skipped\"\3'
          new_content, count = re.subn(pattern, replacement, content, flags=re.DOTALL)
          if count > 0:
              print(f'Replaced {count} expo-updates script(s) in Pods project')
              with open('ios/Pods/Pods.xcodeproj/project.pbxproj', 'w') as f:
                  f.write(new_content)
          else:
              print('No expo-updates script found in Pods project')
          "
          fi
          
          # Method 3: Set environment variable as fallback
          echo "EX_UPDATES_NATIVE_DEBUG=1" >> "$GITHUB_ENV"
          echo "EXPO_UPDATES_ENABLED=0" >> "$GITHUB_ENV"

      - name: Build iOS Archive
        run: |
          set -o pipefail
          cd ios
          xcodebuild \
            -workspace MetaMask.xcworkspace \
            -scheme MetaMask \
            -configuration Release \
            archive \
            -archivePath build/BitcoinPay.xcarchive \
            -destination generic/platform=ios \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            OTHER_CODE_SIGN_FLAGS='--keychain '"$KEYCHAIN_PATH" \
            METRO_MAX_WORKERS=4 \
            NODE_OPTIONS='--max-old-space-size=4096' \
            2>&1 | tee build.log
          # Show errors if build failed
          if [ $? -ne 0 ]; then
            echo "=== BUILD ERRORS ==="
            grep -iE 'error:|fatal|failed' build.log | head -50 || true
          fi

      - name: Update export options with provisioning profile UUID
        run: |
          # Replace the profile name with the actual UUID from the installed profile
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.bitcoinpay.btcp $PROFILE_UUID" \
            ios/MetaMask/IosExportOptionsMetaMaskRelease.plist
          echo "Updated export options with profile UUID: $PROFILE_UUID"
          cat ios/MetaMask/IosExportOptionsMetaMaskRelease.plist

      - name: Export IPA
        run: |
          cd ios
          xcodebuild \
            -exportArchive \
            -archivePath build/BitcoinPay.xcarchive \
            -exportPath build/output \
            -exportOptionsPlist MetaMask/IosExportOptionsMetaMaskRelease.plist \
            OTHER_CODE_SIGN_FLAGS='--keychain '"$KEYCHAIN_PATH" \
            -authenticationKeyPath "$(pwd)/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      - name: Find IPA path
        id: ipa
        run: |
          IPA=$(find ios/build/output -name '*.ipa' -type f | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::No IPA file found"
            exit 1
          fi
          ABS_IPA="$(cd "$(dirname "$IPA")" && pwd)/$(basename "$IPA")"
          echo "path=$ABS_IPA" >> "$GITHUB_OUTPUT"
          echo "Found IPA: $ABS_IPA"

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_FILEPATH: ios/AuthKey.p8
        run: |
          cd ios
          bundle exec fastlane upload_to_testflight_only \
            ipa_path:"${{ steps.ipa.outputs.path }}" \
            groups:"BitcoinPay Beta" \
            changelog:"BitcoinPay build from ${{ github.sha }}" \
            distribute_external:false

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitcoinpay-ios-ipa
          path: ios/build/output/*.ipa
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: |
          rm -f ios/AuthKey.p8
          rm -f ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
          if [ -n "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
