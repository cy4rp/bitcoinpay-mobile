name: iOS Build & TestFlight

on:
  push:
    branches:
      - 'trigger-ios-build/**'
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS & Upload to TestFlight
    runs-on: macos-14-arm64
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install JS dependencies (Yarn 1)
        run: yarn install --frozen-lockfile

      - name: Generate InpageBridgeWeb3
        run: |
          if [ -f scripts/build-inpage-bridge.sh ]; then
            bash scripts/build-inpage-bridge.sh
          fi

      - name: Create minimal .js.env
        run: |
          if [ ! -f .js.env ]; then
            cat > .js.env << 'EOF'
          export MM_FOX_CODE="000"
          export MM_INFURA_PROJECT_ID="null"
          export MM_SENTRY_DSN="https://0@sentry.io/0"
          export SEGMENT_WRITE_KEY=""
          export SEGMENT_PROXY_URL=""
          export SEGMENT_DELETE_API_SOURCE_ID=""
          export WATCHER_PORT=8081
          EOF
            echo "Created .js.env"
          fi

      - name: Create empty xcconfig files
        run: |
          for config in debug release flask-debug flask-release; do
            touch "ios/$config.xcconfig"
          done

      - name: Create placeholder GoogleService-Info.plist
        run: |
          PLIST_DIR="ios/GoogleServices"
          mkdir -p "$PLIST_DIR"
          cat > "$PLIST_DIR/GoogleService-Info-example.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CLIENT_ID</key><string>placeholder</string>
            <key>REVERSED_CLIENT_ID</key><string>placeholder</string>
            <key>API_KEY</key><string>placeholder</string>
            <key>GCM_SENDER_ID</key><string>placeholder</string>
            <key>PLIST_VERSION</key><string>1</string>
            <key>BUNDLE_ID</key><string>com.bitcoinpay.btcp</string>
            <key>PROJECT_ID</key><string>placeholder</string>
            <key>STORAGE_BUCKET</key><string>placeholder</string>
            <key>IS_ADS_ENABLED</key><false/>
            <key>IS_ANALYTICS_ENABLED</key><false/>
            <key>IS_APPINVITE_ENABLED</key><true/>
            <key>IS_GCM_ENABLED</key><true/>
            <key>IS_SIGNIN_ENABLED</key><true/>
            <key>GOOGLE_APP_ID</key><string>placeholder</string>
          </dict>
          </plist>
          PLIST
          # Copy to expected location
          cp "$PLIST_DIR/GoogleService-Info-example.plist" ios/MetaMask/GoogleService-Info.plist 2>/dev/null || \
          cp "$PLIST_DIR/GoogleService-Info-example.plist" "ios/GoogleService-Info.plist" 2>/dev/null || true
          echo "Created GoogleService-Info.plist"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          working-directory: ios
          bundler-cache: true

      - name: Install CocoaPods
        working-directory: ios
        run: bundle exec pod install --repo-update

      - name: Configure Node path for Xcode
        run: |
          NODE_BINARY=$(command -v node)
          echo "export NODE_BINARY=\"$NODE_BINARY\"" > ios/.xcode.env.local
          cat ios/.xcode.env.local

      - name: Setup App Store Connect API Key
        env:
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          echo "$API_KEY_CONTENT" | sed 's/\\n/\n/g' > ios/AuthKey.p8
          LINE_COUNT=$(wc -l < ios/AuthKey.p8)
          if [ "$LINE_COUNT" -le 2 ]; then
            printf '%b\n' "$API_KEY_CONTENT" > ios/AuthKey.p8
          fi
          LINE_COUNT=$(wc -l < ios/AuthKey.p8)
          if [ "$LINE_COUNT" -le 2 ]; then
            RAW=$(echo "$API_KEY_CONTENT" | tr -d '\n' | sed 's/-----BEGIN PRIVATE KEY-----//;s/-----END PRIVATE KEY-----//;s/ //g')
            printf '%s\n' '-----BEGIN PRIVATE KEY-----' > ios/AuthKey.p8
            echo "$RAW" | fold -w 64 >> ios/AuthKey.p8
            printf '%s\n' '-----END PRIVATE KEY-----' >> ios/AuthKey.p8
          fi
          chmod 600 ios/AuthKey.p8
          echo "Key file lines: $(wc -l < ios/AuthKey.p8)"
          mkdir -p ~/private_keys
          cp ios/AuthKey.p8 ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8

      - name: Install signing certificate and provisioning profile
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="ci-$(date +%s)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "=== Imported certificates ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i "$RUNNER_TEMP/profile.mobileprovision"))
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID.mobileprovision"
          echo "Installed provisioning profile: $PROFILE_UUID"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Configure Team ID in export options
        run: |
          sed -i '' "s/TEAM_ID_PLACEHOLDER/${{ secrets.APPLE_TEAM_ID }}/" ios/MetaMask/IosExportOptionsMetaMaskRelease.plist

      - name: Build iOS Archive
        run: |
          set -o pipefail
          cd ios
          xcodebuild \
            -workspace MetaMask.xcworkspace \
            -scheme MetaMask \
            -configuration Release \
            archive \
            -archivePath build/BitcoinPay.xcarchive \
            -destination generic/platform=ios \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            OTHER_CODE_SIGN_FLAGS='--keychain '"$KEYCHAIN_PATH" \
            2>&1 | tee build.log
          if [ $? -ne 0 ]; then
            echo "=== BUILD ERRORS ==="
            grep -iE 'error:|fatal|failed' build.log | tail -50 || true
          fi

      - name: Update export options with provisioning profile UUID
        run: |
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.bitcoinpay.btcp $PROFILE_UUID" \
            ios/MetaMask/IosExportOptionsMetaMaskRelease.plist
          echo "Updated export options with profile UUID: $PROFILE_UUID"
          cat ios/MetaMask/IosExportOptionsMetaMaskRelease.plist

      - name: Export IPA
        run: |
          cd ios
          xcodebuild \
            -exportArchive \
            -archivePath build/BitcoinPay.xcarchive \
            -exportPath build/output \
            -exportOptionsPlist MetaMask/IosExportOptionsMetaMaskRelease.plist \
            OTHER_CODE_SIGN_FLAGS='--keychain '"$KEYCHAIN_PATH" \
            -authenticationKeyPath "$(pwd)/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      - name: Find IPA path
        id: ipa
        run: |
          IPA=$(find ios/build/output -name '*.ipa' -type f | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::No IPA file found"
            exit 1
          fi
          ABS_IPA="$(cd "$(dirname "$IPA")" && pwd)/$(basename "$IPA")"
          echo "path=$ABS_IPA" >> "$GITHUB_OUTPUT"
          echo "Found IPA: $ABS_IPA"

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_FILEPATH: ios/AuthKey.p8
        run: |
          cd ios
          bundle exec fastlane upload_to_testflight_only \
            ipa_path:"${{ steps.ipa.outputs.path }}" \
            groups:"BitcoinPay Beta" \
            changelog:"BitcoinPay build from ${{ github.sha }}" \
            distribute_external:false

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitcoinpay-ios-ipa
          path: ios/build/output/*.ipa
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: |
          rm -f ios/AuthKey.p8
          rm -f ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
          if [ -n "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
